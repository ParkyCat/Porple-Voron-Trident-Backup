[include mcu/AFC_Lite.cfg]

[mcu Tortle]
# canbus_uuid: <replace with your can UUID>
# serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_1D0015001551333235363331-if00



[AFC_BoxTurtle Tortle]
hub: Tortle
extruder: extruder
enable_assist: True        # Setting to True enables espooler assist while printing
enable_kick_start: True    # Setting to True enables full speed espoolers for kick_start_time(0.070 ms default) amount
# buffer: <buffer_name> # If not defined below from the install script, uncomment and add buffer name if using a buffer
buffer: Tortle

[temperature_sensor Tortle]
sensor_type: temperature_mcu
sensor_mcu: Tortle

[AFC_stepper lane1]
unit: Tortle:1
step_pin: Tortle:M1_STEP
dir_pin: !Tortle:M1_DIR
enable_pin: !Tortle:M1_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 155.0
park_dist: 10
led_index: AFC_Indicator:1
afc_motor_rwd: Tortle:MOT1_RWD
afc_motor_fwd: Tortle:MOT1_FWD
afc_motor_enb: Tortle:MOT1_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Tortle:TRG1
load: ^Tortle:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: Tortle:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: Tortle:2
step_pin: Tortle:M2_STEP
dir_pin: !Tortle:M2_DIR
enable_pin: !Tortle:M2_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 80
park_dist: 10
led_index: AFC_Indicator:2
afc_motor_rwd: Tortle:MOT2_RWD
afc_motor_fwd: Tortle:MOT2_FWD
afc_motor_enb: Tortle:MOT2_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Tortle:TRG2
load: ^Tortle:EXT2

[tmc2209 AFC_stepper lane2]
uart_pin: Tortle:M2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane3]
unit: Tortle:3
step_pin: Tortle:M3_STEP
dir_pin: !Tortle:M3_DIR
enable_pin: !Tortle:M3_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 90.0
park_dist: 10
led_index: AFC_Indicator:3
afc_motor_rwd: Tortle:MOT3_RWD
afc_motor_fwd: Tortle:MOT3_FWD
afc_motor_enb: Tortle:MOT3_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Tortle:TRG3
load: ^Tortle:EXT3

[tmc2209 AFC_stepper lane3]
uart_pin: Tortle:M3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane4]
unit: Tortle:4
step_pin: Tortle:M4_STEP
dir_pin: !Tortle:M4_DIR
enable_pin: !Tortle:M4_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 145.0
park_dist: 10
led_index: AFC_Indicator:4
afc_motor_rwd: Tortle:MOT4_RWD
afc_motor_fwd: Tortle:MOT4_FWD
afc_motor_enb: Tortle:MOT4_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!Tortle:TRG4
load: ^Tortle:EXT4

[tmc2209 AFC_stepper lane4]
uart_pin: Tortle:M4_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub Tortle]
switch_pin: ^Tortle:HUB   # Pin for the hub switch
# afc_bowden_length: 1725     # Length of the Bowden tube from the hub to the toolhead sensor in mm.
afc_bowden_length: 760     # Length of the Bowden tube from the hub to the toolhead sensor in mm.
move_dis: 75                # Distance to move the filament within the hub in mm.
#hub_clear_move_dis: 65     # Distance after hub switch becomes fast to retract to insure hub is clear
cut: False                  # Hub cutter installed (e.g. Snappy)

#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
assisted_retract: False     # If True, retracts are assisted to prevent loose windows on the spool
cut_cmd: AFC #CMD to use
cut_dist: 50                # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).

#[AFC_screen Tortle]
#mac_address: None

[AFC_led AFC_Indicator]
pin: Tortle:RGB1
chain_count: 4
color_order: GRBW

#[neopixel Extra2]
#pin: Tortle:RGB2
#chain_count: 6
#color_order: GRB

#[neopixel Extra3]
#pin: Tortle:RGB3
#chain_count: 6
#color_order: GRB

#[neopixel Extra4]
#pin: Tortle:RGB4
#chain_count: 4
#color_order: GRB

[AFC_buffer Tortle]
advance_pin: ^Tortle:TN_ADV    # set advance pin
trailing_pin: ^Tortle:TN_TRL  # set trailing pin
multiplier_high: 1.05   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament
