[include mainsail.cfg]
[include printerMacros.cfg]

[mcu]
canbus_uuid: c4029d138008						

[mcu EBB0]
canbus_uuid: cd7c57685837						

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 10000
max_z_velocity: 15
max_z_accel: 350
# square_corner_velocity: 5.0
square_corner_velocity: 10.0

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor CM4]
sensor_type: temperature_host

#test Autotune
[autotune_tmc stepper_x]
motor: ldo-42sth48-2804ah
tuning_goal: performance
# extra_hysteresis: 1
sgt: 2
[autotune_tmc stepper_y]
motor: ldo-42sth48-2804ah
tuning_goal: performance
# extra_hysteresis: 1
sgt: 2
[autotune_tmc stepper_z]
motor: moons-le172s-t0804-300-cn-01-200
tuning_goal: performance
# extra_hysteresis: 1
[autotune_tmc stepper_z1]
motor: moons-le172s-t0804-300-cn-01-200
tuning_goal: performance
# extra_hysteresis: 1
[autotune_tmc stepper_z2]
motor: moons-le172s-t0804-300-cn-01-200
tuning_goal: performance
# extra_hysteresis: 1

#####################################################################
# 	X/Y Stepper Settings
#####################################################################
#####################################################################

[stepper_x]
step_pin = PE6
dir_pin = PE5
enable_pin = !PC14
microsteps = 32
rotation_distance: 40
endstop_pin = tmc2240_stepper_x:virtual_endstop
position_min: -1
position_endstop: 250
position_max: 250
homing_speed = 100
homing_positive_dir = true

[tmc2240 stepper_x]
cs_pin = PC13
spi_software_miso_pin = PG7
spi_software_sclk_pin = PG8
spi_software_mosi_pin = PG6
diag0_pin = ^!PF4
interpolate = True
run_current = 1.1
# stealthchop_threshold = 0
rref: 12000 

[stepper_y]
step_pin = PE2
dir_pin = PE1
enable_pin = !PE4
microsteps = 32
rotation_distance: 40
endstop_pin = tmc2240_stepper_y:virtual_endstop
position_min: -8
position_endstop: 250
position_max: 250
homing_speed = 100
homing_positive_dir = true

[tmc2240 stepper_y]
cs_pin = PE3
spi_software_miso_pin = PG7
spi_software_sclk_pin = PG8
spi_software_mosi_pin = PG6
diag0_pin = ^!PF3
interpolate = True
run_current = 1.1
rref: 12000 
# stealthchop_threshold = 0


#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4    
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -2
homing_speed: 10.0 # 10 is a recommended max.
second_homing_speed: 3
homing_retract_dist: 2

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z]
cs_pin = PB9
spi_software_mosi_pin = PG6
spi_software_miso_pin = PG7
spi_software_sclk_pin = PG8
run_current = 1
# stealthchop_threshold = 0
interpolate: True
rref: 12000 

##	Z1 Stepper - Rear  on Motor5
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z1]
cs_pin = PB5
spi_software_mosi_pin = PG6
spi_software_miso_pin = PG7
spi_software_sclk_pin = PG8
run_current = 1
# stealthchop_threshold = 0
interpolate: True
rref: 12000 

##	Z2 Stepper - Front Right on Motor6
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4  
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_z2]
cs_pin = PG14
spi_software_mosi_pin = PG6
spi_software_miso_pin = PG7
spi_software_sclk_pin = PG8
run_current = 1
# stealthchop_threshold = 0
interpolate: True
rref: 12000 

#####################################################################
# 	Extruder
#####################################################################

[tmc2209 extruder]
uart_pin: EBB0:PA15
run_current: 0.45
stealthchop_threshold: 999999999
sense_resistor: 0.11

[extruder] 
step_pin: EBB0:PD0
dir_pin: EBB0:PD1
enable_pin: !EBB0:PD2
heater_pin: EBB0:PB13
sensor_pin: EBB0:PA3
microsteps: 16
rotation_distance: 53.494165  # Re-calibrate your own value
# full_steps_per_rotation: 200
# max_extrude_only_distance: 101
gear_ratio: 44:10, 37:17
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 500
sensor_type: Generic 3950
pressure_advance: 0.030
pressure_advance_smooth_time: 0.015
control: pid #pid_Kp=38.927 pid_Ki=8.949 pid_Kd=42.332
pid_Kp: 38.927
pid_Ki: 8.949
pid_Kd: 42.332
min_temp: -200
max_temp: 305
min_extrude_temp: 0
max_extrude_cross_section: 1
#   Maximum area (in mm^2) of an extrusion cross section (eg,
#   extrusion width multiplied by layer height). This setting prevents
#   excessive amounts of extrusion during relatively small XY moves.
#   If a move requests an extrusion rate that would exceed this value
#   it will cause an error to be returned. The default is: 4.0 *
#   nozzle_diameter^2

#####################################################################
# 	Bed Heater
#####################################################################
[temperature_sensor bed_heater]
sensor_type = Generic 3950
sensor_pin = PB0

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 115
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

#####################################################################
# 	Probe
#####################################################################

[probe]
pin: ^EBB0:PB6
# tool: 0 # change to the index of the tool. 0, 1, 2, etc.
#z_offset = 0 # Needs to be calibrated. More positive = More Squish 
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.04
samples_tolerance_retries: 10
# activate_gcode:
#     _TAP_PROBE_ACTIVATE HEATER=extruder # change to match the extruder you are configuring: extruder, extruder1, etc.

#####################################################################
# 	Fan Control
#####################################################################
[fan]
pin: EBB0:PA1

[heater_fan hotend_fan]
pin: EBB0:PA0
heater: extruder
heater_temp: 70.0
##  If you are experiencing back flow, you can reduce fan_speed
fan_speed: 0.65
max_power: 1.0
kick_start_time: 3.0

[output_pin chamberlight]
#Chamber Lighting - HE0 Connector
pin: PA0
pwm:true
shutdown_value: 0
cycle_time: 0.01

# [fan_generic TMC2240_Fan]
# pin: PA4
# max_power: 1.0
# shutdown_speed: 0.0
# kick_start_time: 0.5
[controller_fan TMC2240_Fan]
##  Controller fan
pin: PA4
max_power: 1
kick_start_time: 1
fan_speed: 0.25
stepper: stepper_x

[fan_generic exhaust_fan]
pin: PA5
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5

[fan_generic fan_leftrear]
pin: PF7
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5

[fan_generic fan_leftfront]
pin: PF9
kick_start_time: 0.5
# off_below: 0.10

[fan_generic fan_rightrear]
pin: PF6
kick_start_time: 0.5
# off_below: 0.10

[fan_generic fan_rightfront]
pin: PF8
kick_start_time: 0.5
# off_below: 0.10



#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
gcode:
  TURN_OFF_HEATERS
  M84
#   A list of G-Code commands to execute on an idle timeout. See
#   docs/Command_Templates.md for G-Code format. The default is to run
  # "TURN_OFF_HEATERS" and "M84".
timeout: 3600
#   Idle time (in seconds) to wait before running the above G-Code
#   commands. The default is 600 seconds.

[safe_z_home]
##--------------------------------------------------------------------

#	Uncomment below for 250mm build
home_xy_position: 125,125

##--------------------------------------------------------------------
speed: 100
z_hop: 10

[z_tilt]

##--------------------------------------------------------------------
## Uncomment below for 250mm build
z_positions:
   -50, 18
   125, 298
   300, 18
points:
   30, 5
   125, 195
   220, 5

##--------------------------------------------------------------------

speed: 200
horizontal_move_z: 7
retries: 5
retry_tolerance: 0.015


[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 10,10
mesh_max: 240,240
probe_count: 7,7
algorithm: bicubic
bicubic_tension: 0.2

##--------------------------------------------------------------------
[input_shaper]
shaper_freq_x: 67.6
shaper_type_x: mzv
damping_ratio_x: 0.078 
shaper_freq_y: 52.4
shaper_type_y: mzv
damping_ratio_y: 0.062


########################################
# EXP1 / EXP2 (display) pins
########################################

# [board_pins]
# aliases:
#     # EXP1 header
#     EXP1_1=PE7, EXP1_2=PG1,
#     EXP1_3=PG0, EXP1_4=PF15,
#     EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
#     EXP1_7=PF12, EXP1_8=PF11,
#     EXP1_9=<GND>, EXP1_10=<5V>,

#     # EXP2 header
#     EXP2_1=PE13, EXP2_2=PE12,
#     EXP2_3=PE15, EXP2_4=PE11,
#     EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
#     EXP2_7=PE8, EXP2_8=<RST>,
#     EXP2_9=<GND>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.


#####################################################################
# 	Macros
#####################################################################
[gcode_arcs]
resolution: .3
[exclude_object]

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    Z_TILT_ADJUST
    G28
    #--------------------------------------------------------------------
    ##	Uncomment for 250mm build
    G0 X125 Y125 Z30 F3600
    #--------------------------------------------------------------------
   
[gcode_macro PRINT_START]
gcode:
  SET_PIN PIN=chamberlight VALUE=0.22
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(195)|float %}
  {% set S_EXTRUDER_TEMP = 150|float %}
  {% set initial_tool = params.TOOL|default("0")|int %}
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  
  G90 ; use absolute coordinates
  M83 ; extruder relative mode

  G28 # Home Printer
  AFC_PARK

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.1
    # STATUS_HEATING                                      # Set LEDs to heating-mode
    M106 S255                                           # Turn on the PT-fan

    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turn on the nevermore

    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    G4 P100000                                          # Wait 5 div by 3 min for the bedtemp to stabilize
    # SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"  # Display info on display
    # TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber_wait}   # Waits for chamber temp

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.3
    # STATUS_HEATING                                      # Set LEDs to heating-mode
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Soak for 5 min"               # Display info on display
    G4 P100000                                          # Wait 5 div by 3 min for the bedtemp to stabilize
  {% endif %}

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  SET_DISPLAY_TEXT MSG="Hotend: 150c"                   # Display info on display
  M109 S150                                             # Heat hotend to 150c

  ##  Uncomment for Trident (Z_TILT_ADJUST)
  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  # STATUS_LEVELING                                      # Set LEDs to leveling-mode
  Z_TILT_ADJUST                                        # Level the printer via Z_TILT_ADJUST
  G28 Z                                                # Home Z again after Z_TILT_ADJUST

  #  Uncomment for bed mesh (2 of 2 for bed mesh)
  SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
  # STATUS_MESHING                                       # Set LEDs to bed mesh-mode
  BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=3       # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh

  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  # STATUS_HEATING                                        # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  # STATUS_PRINTING                                       # Set LEDs to printing-mode
  G0 X{x_wait - 50} Y4 F10000                           # Go to starting point



  AFC_PARK

  M109 S{EXTRUDER_TEMP} # wait for extruder temp
  T{initial_tool} #Load Initial Tool
  
  G1 X5 Y3 Z0.4 F10000                                # Go to starting point
  G1 X245 E70 F400                                   # Primeline

  
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    AUTORETRACT
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X125 Y250 F3600            ; park nozzle at rear
    BED_MESH_CLEAR
    
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    OFF
    

[resonance_tester]
accel_chip: adxl345
probe_points:
     125, 125, 20  
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

[adxl345]
cs_pin: EBB0:PB12
spi_software_sclk_pin: EBB0:PB10
spi_software_mosi_pin: EBB0:PB11
spi_software_miso_pin: EBB0:PB2
axes_map: x,z,-y

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
# show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

